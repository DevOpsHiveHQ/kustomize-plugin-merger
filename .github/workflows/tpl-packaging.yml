name: Packaging

on:
  workflow_call:
    inputs:
      goreleaser-version:
        default: '~> v2'
        type: string
      goreleaser-args:
        required: true
        type: string
      artifacts-cache:
        default: false
        type: boolean
      artifacts-identifier:
        default: latest
        type: string
      artifacts-publish-ci:
        default: false
        type: boolean
      artifacts-cache-key:
        default: dist
        type: string
      artifacts-cache-path:
        default: dist
        type: string

permissions:
  contents: read

jobs:
  run:
    name: Run GoReleaser
    permissions:
      id-token: write
      contents: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version-file: go.mod
        cache: false
    - name: Setup Golang Caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Setup Cosign
      uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # main
    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5
      with:
        version: "${{ inputs.goreleaser-version }}"
        args: "${{ inputs.goreleaser-args }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Cleanup CI Docker Image
      if: ${{ inputs.artifacts-publish-ci }}
      uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        package-name: kustomize-generator-merger-ci
        package-type: container
        min-versions-to-keep: 10
    - name: Publish CI Docker Image
      if: ${{ inputs.artifacts-publish-ci }}
      run: |
        for xarch in amd64 arm64; do
          docker_image_src="ghcr.io/devopshivehq/kustomize-generator-merger:latest-${xarch}"
          docker_image_dst="ghcr.io/devopshivehq/kustomize-generator-merger-ci:${{ inputs.artifacts-identifier }}-${xarch}"
          echo "Tag and push image: ${docker_image_dst}"
          docker tag ${docker_image_src} ${docker_image_dst}
          docker push ${docker_image_dst}
        done
    - name: Cache Artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: ${{ inputs.artifacts-cache }}
      with:
        path: "${{ inputs.artifacts-cache-path }}"
        key: "${{ inputs.artifacts-cache-key }}"
